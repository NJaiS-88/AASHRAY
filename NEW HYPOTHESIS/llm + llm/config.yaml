chunking:
  chunk_size: 500       # tokens per chunk
  chunk_overlap: 50      # token overlap between consecutive chunks
  encoding_name: "cl100k_base"

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384
  metric: "cosine"
  device: "cpu"

pinecone:
  index_name: "disaster-rag"
  dimension: 384
  metric: "cosine"
  cloud: "aws"
  region: "us-east-1"
  batch_size: 100

retrieval:
  top_k: 3
  cache_dir: "retrieval_cache"

llm:
  model: "openai/gpt-oss-120b"
  base_url: "https://api.groq.com/openai/v1/chat/completions"
  temperature_stage1: 0.0
  temperature_stage2: 0.0
  max_tokens_stage1: 500
  reasoning_effort: "low"
  reasoning_format: "parsed"
  timeout_seconds: 60.0
  max_retries: 3

paths:
  pdfs_dir: "../pdfs"
  runs_log: "runs.jsonl"
